<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>senar5&6</title>

<style>
    body {
        margin: 0;
        background: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h2 {
        margin: 15px 0 5px;
    }

    #namaNot {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    svg {
        width: 100%;
        max-width: 900px;
        height: 330px;
        display: block;
        margin: auto;
    }

    .garis {
        stroke: black;
        stroke-width: 2;
    }

    .garis-bantu {
        stroke: black;
        stroke-width: 2;
    }

    .kepala-not {
        fill: black;
    }

    .batang-not {
        stroke: black;
        stroke-width: 2;
    }

    .clef {
        font-size: 115px;
        font-family: "Times New Roman", serif;
    }
</style>
</head>

<body>

<h2>Latihan Membaca Not Gitar</h2>
<div id="namaNot"></div>

<svg id="notasi"
     viewBox="0 0 900 330"
     preserveAspectRatio="xMidYMid meet">

    <!-- 5 garis paranada -->
    <line class="garis" x1="70" y1="80"  x2="850" y2="80"/>
    <line class="garis" x1="70" y1="96"  x2="850" y2="96"/>
    <line class="garis" x1="70" y1="112" x2="850" y2="112"/>
    <line class="garis" x1="70" y1="128" x2="850" y2="128"/>
    <line class="garis" x1="70" y1="144" x2="850" y2="144"/>

    <!-- Kunci G -->
    <text x="35" y="158" class="clef">𝄞</text>

    <!-- tempat not akan digambar -->
    <g id="not"></g>

</svg>


<script>

const nada = [

    {
        nama: "E",
        frekuensi: 82.41,
        senar: 6,
        fret: 0,

        // Spasi di bawah garis bantu ke-3
        y: 256,

        // 3 garis bantu
        garisBantu: [208, 224, 240]
    },

    {
        nama: "F",
        frekuensi: 87.31,
        senar: 6,
        fret: 1,

        // Garis bantu ke-3
        y: 240,

        garisBantu: [208, 224, 240]
    },

    {
        nama: "G",
        frekuensi: 98.00,
        senar: 6,
        fret: 3,

        // Spasi antara garis bantu ke-2 dan ke-3
        y: 224,

        garisBantu: [208, 224]
    },

    {
        nama: "A",
        frekuensi: 110.00,
        senar: 5,
        fret: 0,

        // Garis bantu ke-2
        y: 208,

        garisBantu: [208, 224]
    },

    {
        nama: "B",
        frekuensi: 123.47,
        senar: 5,
        fret: 2,

        // Spasi antara garis bantu ke-1 dan ke-2
        y: 192,

        garisBantu: [208]
    },

    {
        nama: "C",
        frekuensi: 130.81,
        senar: 5,
        fret: 3,

        // Garis bantu ke-1
        y: 176,

        garisBantu: [176]
    },

    {
        nama: "D",
        frekuensi: 146.83,
        senar: 5,
        fret: 5,

        // Spasi tepat di bawah garis paranada
        y: 160,

        garisBantu: []
    }

];


let notSebelumnya = null;


// ===============================
// MEMILIH NOT ACAK
// ===============================

function pilihNot() {

    let notBaru;

    do {
        const index = Math.floor(Math.random() * nada.length);
        notBaru = nada[index];

    } while (
        nada.length > 1 &&
        notBaru.nama === notSebelumnya
    );

    notSebelumnya = notBaru.nama;

    gambarNot(notBaru);
}


// ===============================
// MENGGAMBAR NOT
// ===============================

function gambarNot(not) {

    const group = document.getElementById("not");

    // Hapus not sebelumnya
    group.innerHTML = "";

    const x = 500;
    const y = not.y;

    // ===========================
    // GARIS BANTU
    // ===========================

    not.garisBantu.forEach(function(gy) {

        const garis = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

        garis.setAttribute("x1", x - 30);
        garis.setAttribute("x2", x + 30);
        garis.setAttribute("y1", gy);
        garis.setAttribute("y2", gy);
        garis.setAttribute("class", "garis-bantu");

        group.appendChild(garis);
    });


    // ===========================
    // KEPALA NOT
    // ===========================

    const kepala = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
    );

    kepala.setAttribute("cx", x);
    kepala.setAttribute("cy", y);
    kepala.setAttribute("rx", 14);
    kepala.setAttribute("ry", 10);
    kepala.setAttribute("class", "kepala-not");

    // Sedikit dimiringkan seperti not asli
    kepala.setAttribute(
        "transform",
        `rotate(-20 ${x} ${y})`
    );

    group.appendChild(kepala);


    // ===========================
    // BATANG NOT
    // ===========================

    const batang = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    batang.setAttribute("x1", x + 11);
    batang.setAttribute("x2", x + 11);
    batang.setAttribute("y1", y);
    batang.setAttribute("y2", y - 75);
    batang.setAttribute("class", "batang-not");

    group.appendChild(batang);
}


// ===============================
// MIKROFON
// ===============================

let analyser;
let dataArray;

navigator.mediaDevices.getUserMedia({
    audio: true
})
.then(function(stream) {

    const audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    const source =
        audioContext.createMediaStreamSource(stream);

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 4096;

    source.connect(analyser);

    dataArray =
        new Float32Array(analyser.fftSize);

    deteksiNada();

})
.catch(function(error) {

    document.body.innerHTML =
        "<h2>Izinkan akses mikrofon untuk menggunakan latihan ini.</h2>";

});


// ===============================
// DETEKSI FREKUENSI
// ===============================

let waktuTerakhir = 0;

function deteksiNada() {

    requestAnimationFrame(deteksiNada);

    if (!analyser) return;

    analyser.getFloatTimeDomainData(dataArray);

    // ---------------------------
    // Hitung RMS
    // ---------------------------

    let jumlah = 0;

    for (let i = 0; i < dataArray.length; i++) {
        jumlah += dataArray[i] * dataArray[i];
    }

    const rms =
        Math.sqrt(jumlah / dataArray.length);

    // Abaikan suara terlalu kecil
    if (rms < 0.015) {
        return;
    }


    // ---------------------------
    // Autocorrelation
    // ---------------------------

    let terbaik = 0;
    let nilaiTerbaik = 0;

    for (let offset = 20; offset < 1000; offset++) {

        let korelasi = 0;

        for (
            let i = 0;
            i < dataArray.length - offset;
            i++
        ) {
            korelasi +=
                dataArray[i] *
                dataArray[i + offset];
        }

        if (korelasi > nilaiTerbaik) {

            nilaiTerbaik = korelasi;
            terbaik = offset;

        }
    }


    if (terbaik === 0) {
        return;
    }


    const frekuensi =
        analyser.context.sampleRate / terbaik;


    // ---------------------------
    // Cari not terdekat
    // ---------------------------

    let notTerdekat = null;
    let selisihTerkecil = Infinity;

    nada.forEach(function(not) {

        const selisih =
            Math.abs(frekuensi - not.frekuensi);

        if (selisih < selisihTerkecil) {

            selisihTerkecil = selisih;
            notTerdekat = not;

        }
    });


    if (!notTerdekat) {
        return;
    }


    // ---------------------------
    // Toleransi 2,5%
    // ---------------------------

    const error =
        Math.abs(
            frekuensi - notTerdekat.frekuensi
        ) / notTerdekat.frekuensi;


    if (error > 0.025) {
        return;
    }


    // ---------------------------
    // Jangan membaca satu petikan
    // berkali-kali
    // ---------------------------

    const sekarang = Date.now();

    if (sekarang - waktuTerakhir < 500) {
        return;
    }


    waktuTerakhir = sekarang;


    // ---------------------------
    // Cek jawaban
    // ---------------------------

    const notSekarang =
        nada.find(function(n) {
            return n.nama === notSebelumnya;
        });


    if (
        notSekarang &&
        notTerdekat.nama === notSekarang.nama
    ) {

        // BENAR
        // Langsung ganti not

        pilihNot();

    }

}


// ===============================
// MULAI DENGAN NOT ACAK
// ===============================

pilihNot();

</script>

</body>
</html>
